<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A tiny surprise ♡</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fff7f7,#fdf1f6);
  font-family:Georgia,"Times New Roman",serif;
  color:#5c4650;
  overflow-x:hidden;
}
.wrap{
  width:min(92vw,430px);
  text-align:center;
  padding:28px;
}
.card{
  background:rgba(255,255,255,.86);
  border:1px solid rgba(190,140,160,.22);
  border-radius:28px;
  padding:38px 26px;
  box-shadow:0 18px 50px rgba(100,60,80,.12);
}
.tiny{
  font:600 11px/1.2 Arial,sans-serif;
  letter-spacing:3px;
  text-transform:uppercase;
  opacity:.55;
}
.flower{
  font-size:58px;
  margin:14px 0;
  animation:float 3s ease-in-out infinite;
}
h1{
  font-size:28px;
  font-weight:400;
  line-height:1.3;
  margin:14px 0 8px;
}
.note{
  font-size:14px;
  line-height:1.6;
  opacity:.68;
}
button{
  margin-top:20px;
  border:0;
  border-radius:999px;
  padding:13px 22px;
  background:#7c5868;
  color:white;
  font-size:14px;
  cursor:pointer;
}
button:active{
  transform:scale(.98);
}
/* SURPRISE */
#secret{
  display:none;
  margin-top:24px;
  animation:appear .8s ease forwards;
}
/* PHOTO */
.photo{
  width:100%;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(100,60,80,.15);
}
.photo img{
  width:100%;
  height:auto;
  display:block;
}
/* MESSAGE UNDER PHOTO */
.message{
  font-size:17px;
  line-height:1.6;
  margin-top:18px;
}
/* SMALL MESSAGE */
.small-message{
  font-size:12px;
  line-height:1.6;
  opacity:.65;
  margin-top:20px;
}
/* HEARTS */
.heart{
  position:fixed;
  pointer-events:none;
  animation:rise 4s linear forwards;
  opacity:.7;
}
/* ANIMATIONS */
@keyframes float{
  50%{
    transform:translateY(-7px);
  }
}
@keyframes rise{
  from{
    transform:translateY(0) scale(.8);
    opacity:.8;
  }
  to{
    transform:translateY(-105vh) scale(1.3);
    opacity:0;
  }
}
@keyframes appear{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
  <div class="tiny">
    a tiny surprise ♡
  </div>
  <div class="flower">
    🌷
  </div>
  <h1>
    A little something for you...
  </h1>
  <p class="note">
    I made this just for you ♡
  </p>
  <button id="btn" type="button">
    open your tiny surprise
  </button>
  <!-- SURPRISE -->
  <div id="secret">
    <!-- YOUR PHOTO -->
    <div class="photo">
      <img src="foto.jpeg" alt="A little surprise">
    </div>
    <!-- MESSAGE UNDER PHOTO -->
    <div class="message">
      The flower isn’t blooming yet...<br>
      but I hope you’ll like it anyway ♡
    </div>
    <!-- SMALL MESSAGE AT THE BOTTOM -->
    <div class="small-message">
      You can be mad at me again later 🤭<br>
      but for now… just smile for me, okay? ♡
    </div>
  </div>
</section>
</main>
<script>
const btn = document.getElementById("btn");
const secret = document.getElementById("secret");
btn.addEventListener("click", function(){
  secret.style.display = "block";
  btn.style.display = "none";
  /* floating hearts */
  for(let i = 0; i < 16; i++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent =
      Math.random() > .5 ? "♡" : "✦";
    h.style.left =
      (10 + Math.random() * 80) + "vw";
    h.style.bottom = "-20px";
    h.style.fontSize =
      (12 + Math.random() * 18) + "px";
    h.style.animationDelay =
      (Math.random() * .8) + "s";
    document.body.appendChild(h);
    setTimeout(function(){
      h.remove();
    },4500);
  }
});
</script>
</body>
</html>
